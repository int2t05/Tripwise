# 桌面端在目标系统运行检查；主分支推送与手动运行另生成候选安装包。
name: Desktop validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.platform }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      TRIPWISE_CANDIDATE_OUTPUT: release-candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            runner: macos-15
            executable: release-candidate/mac-arm64/行程有数.app/Contents/MacOS/行程有数
            artifact_paths: |
              release-candidate/*.dmg
              release-candidate/*arm64-mac.zip
              release-candidate/SHA256SUMS
          - platform: win
            runner: windows-2022
            executable: release-candidate-test/win-unpacked/行程有数.exe
            artifact_paths: |
              release-candidate/*.exe
              release-candidate/*-win.zip
              release-candidate/SHA256SUMS
          - platform: linux
            runner: ubuntu-22.04
            executable: release-candidate-test/linux-unpacked/tripwise
            artifact_paths: |
              release-candidate/*.AppImage
              release-candidate/SHA256SUMS

    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install Linux desktop test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth

      - name: Install locked dependencies
        run: npm ci

      - name: Audit all locked dependencies
        run: npm audit --audit-level=high

      - name: Typecheck, unit tests and production build
        run: npm run check

      - name: Desktop end-to-end test (macOS / Windows)
        if: runner.os != 'Linux'
        run: node tests/e2e/desktop-workspace.mjs

      - name: Desktop end-to-end test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/e2e/desktop-workspace.mjs

      - name: Build and verify platform candidate
        if: github.event_name != 'pull_request'
        env:
          TRIPWISE_CANDIDATE_PRECHECK: passed
        run: npm run "package:candidate:${{ matrix.platform }}"

      - name: Build unpacked Linux test application
        if: github.event_name != 'pull_request' && matrix.platform == 'linux'
        run: node node_modules/electron-builder/cli.js --linux --x64 --dir --publish never --config.directories.output=release-candidate-test

      - name: Build unpacked Windows test application
        if: github.event_name != 'pull_request' && matrix.platform == 'win'
        run: node node_modules/electron-builder/cli.js --win --x64 --dir --publish never --config.directories.output=release-candidate-test

      - name: Packaged end-to-end test (Windows)
        if: github.event_name != 'pull_request' && matrix.platform == 'win'
        env:
          TRIPWISE_E2E_EXECUTABLE: ${{ matrix.executable }}
        run: node tests/e2e/desktop-workspace.mjs

      - name: Packaged end-to-end test (Linux)
        if: github.event_name != 'pull_request' && matrix.platform == 'linux'
        env:
          TRIPWISE_E2E_EXECUTABLE: ${{ matrix.executable }}
        run: xvfb-run -a node tests/e2e/desktop-workspace.mjs

      - name: Upload verified candidate artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tripwise-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove packaged test application
        if: always() && matrix.platform != 'mac'
        run: >-
          node -e "require('node:fs').rmSync('release-candidate-test', { recursive: true, force: true })"

  release:
    name: Verify assets and publish preview
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      TRIPWISE_CANDIDATE_OUTPUT: release-candidate-release
      TRIPWISE_PUBLIC_OUTPUT: release-candidate-public

    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Download verified platform packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tripwise-*-${{ github.sha }}
          path: release-artifacts
          merge-multiple: false

      - name: Assemble and verify release files
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version." >&2
            exit 1
          fi

          mkdir -p "$TRIPWISE_CANDIDATE_OUTPUT"
          artifact_count=0
          for artifact_directory in release-artifacts/tripwise-*; do
            [[ -d "$artifact_directory" ]] || { echo "No verified platform artifacts were downloaded." >&2; exit 1; }
            artifact_count=$((artifact_count + 1))
            (
              cd "$artifact_directory"
              sha256sum --check --strict SHA256SUMS
            )
            while IFS= read -r -d '' artifact_file; do
              [[ "${artifact_file##*/}" == "SHA256SUMS" ]] && continue
              cp -n "$artifact_file" "$TRIPWISE_CANDIDATE_OUTPUT/"
            done < <(find "$artifact_directory" -maxdepth 1 -type f -print0)
          done
          [[ "$artifact_count" -eq 3 ]] || { echo "Expected three platform artifacts, received $artifact_count." >&2; exit 1; }

          npm run checksums -- "$TRIPWISE_CANDIDATE_OUTPUT"
          TRIPWISE_CANDIDATE_OUTPUT="$TRIPWISE_CANDIDATE_OUTPUT" npm run verify:candidate:checksums

          public_output="$TRIPWISE_PUBLIC_OUTPUT"
          mkdir "$public_output"
          for source_path in "$TRIPWISE_CANDIDATE_OUTPUT"/*; do
            source_name="${source_path##*/}"
            case "$source_name" in
              *-arm64.dmg) asset_name="Tripwise-$version-arm64.dmg" ;;
              *-arm64-mac.zip) asset_name="Tripwise-$version-arm64-mac.zip" ;;
              *" Setup $version.exe") asset_name="Tripwise-$version-x64-setup.exe" ;;
              *-win.zip) asset_name="Tripwise-$version-x64-win.zip" ;;
              *-"$version".AppImage) asset_name="Tripwise-$version-x64.AppImage" ;;
              SHA256SUMS) continue ;;
              *) echo "Unexpected release input: $source_name" >&2; exit 1 ;;
            esac
            cp -p "$source_path" "$public_output/$asset_name"
          done

          asset_count="$(find "$public_output" -maxdepth 1 -type f | wc -l | tr -d '[:space:]')"
          [[ "$asset_count" == "5" ]] || { echo "Expected five installer files, found $asset_count." >&2; exit 1; }
          npm run checksums -- "$public_output"
          (
            cd "$public_output"
            sha256sum --check --strict SHA256SUMS
          )

          awk -v marker="## [$version]" '
            index($0, marker) == 1 { in_section = 1; next }
            in_section && substr($0, 1, 3) == "## " { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          [[ -s release-notes.md ]] || { echo "CHANGELOG.md has no notes for $version." >&2; exit 1; }

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          title="行程有数 Tripwise ${tag#v} 预览版"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file release-notes.md --prerelease
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$title" --notes-file release-notes.md --prerelease
          fi

          while IFS= read -r old_asset; do
            [[ -f "$TRIPWISE_PUBLIC_OUTPUT/$old_asset" ]] && continue
            gh release delete-asset "$tag" "$old_asset" --repo "$GITHUB_REPOSITORY" --yes
          done < <(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')

          gh release upload "$tag" "$TRIPWISE_PUBLIC_OUTPUT"/* --repo "$GITHUB_REPOSITORY" --clobber

          release_asset_count="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          [[ "$release_asset_count" == "6" ]] || { echo "Expected five installers and SHA256SUMS; found $release_asset_count release assets." >&2; exit 1; }
          expected_assets="$(find "$TRIPWISE_PUBLIC_OUTPUT" -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)"
          actual_assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          [[ "$actual_assets" == "$expected_assets" ]] || { echo "GitHub Release asset names do not match the verified package set." >&2; exit 1; }
